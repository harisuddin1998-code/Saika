name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build the three apps for their GitHub Pages sub-paths
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          flutter build web --release -t lib/main.dart --base-href "/$REPO_NAME/rider/" -o site/rider
          flutter build web --release -t lib/main_driver.dart --base-href "/$REPO_NAME/driver/" -o site/driver
          flutter build web --release -t lib/main_admin.dart --base-href "/$REPO_NAME/admin/" -o site/admin
          cp web_landing/index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
